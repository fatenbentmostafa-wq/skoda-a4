name: build android apk

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 (زي مصاريف البيت) محتاج Node 22 و Java 21
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install deps
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: prepare web folder
        run: |
          mkdir -p www/icons
          cp ../offline.html www/ 2>/dev/null || true
          cp ../manifest.json www/ 2>/dev/null || true
          cp ../*.png www/ 2>/dev/null || true
          printf '%s' '<!doctype html><meta http-equiv="refresh" content="0;url=https://fatenbentmostafa-wq.github.io/skoda-a4/">' > www/index.html

      - name: create android project
        run: npx cap add android || npx cap sync android
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: app icon and splash
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../icon.png assets/icon.png 2>/dev/null || cp ../app-512.png assets/icon.png 2>/dev/null || true
          cp ../splash.png assets/splash.png 2>/dev/null || true
          cp ../splash-dark.png assets/splash-dark.png 2>/dev/null || true
          npx --yes @capacitor/assets@3 generate --android --assetPath assets || true

      # مفتاح توقيع ثابت: عشان التحديث يتثبت فوق القديم، ودخول جوجل يشتغل (بصمته متسجلة في Firebase)
      - name: decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ضيف ANDROID_KEYSTORE_B64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS في Settings > Secrets > Actions"; exit 1; fi
          echo "$KS" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: patch project
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node scripts/patch-android.js

      # البصمة وزرار الرجوع والمشاركة
      - name: sync plugins
        run: npx cap sync android

      - name: build apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../skoda.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: skoda-apk
          path: android-app/skoda.apk

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: تطبيق صيانة سكودا - آخر نسخة
          body: نزّل skoda.apk وثبّته فوق القديم. النسخة 1.0.${{ github.run_number }}
          files: android-app/skoda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
