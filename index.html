<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1411">
<title>SKODA A4 — صيانة العربية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="app-192.png">
<link rel="apple-touch-icon" href="app-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1411; --bg2:#0d1a16; --card:#102320; --card2:#15302a; --line:#1e3a33;
  --txt:#eaf3ef; --muted:#88a69c;
  --em:#17a673; --em2:#22c88c; --gold:#d6b24a; --gold2:#f0cc6a;
  --ok:#17a673; --warn:#d6b24a; --bad:#d9534f;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(900px 500px at 50% -15%, #123a2e 0%, var(--bg) 60%) no-repeat, var(--bg);
  color:var(--txt); font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh; padding:0 0 86px; font-size:15px;
}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 10px}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== header ===== */
header.top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.brand{width:46px;height:46px;border-radius:50%;background:#06100d;
  border:1px solid #2a6b55;display:grid;place-items:center;font-size:21px;flex:0 0 auto;overflow:hidden}
.brand img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{font-weight:700;font-size:17px;line-height:1.25}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.who{background:#13302a;border:1px solid var(--line);color:var(--gold2);border-radius:20px;
  padding:5px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}

/* ===== odometer ===== */
.odo{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;margin-bottom:14px}
.odo .lbl{color:var(--muted);font-size:12px;letter-spacing:.3px}
.odo .num{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-top:2px;
  font-variant-numeric:tabular-nums}
.odo .num span{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:5px}
.odo .meta{color:var(--muted);font-size:11px;margin-top:6px}
.odo .acts{display:flex;gap:8px;margin-top:12px}
.odo .acts .btn{flex:1}

/* ===== buttons ===== */
.btn{background:var(--em);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;
  font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#2b2100}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:transparent;border:1px solid #4a2a28;color:#f0908d}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== section heads ===== */
.sec{display:flex;align-items:center;gap:8px;margin:18px 3px 11px}
.sec h2{font-size:13.5px;font-weight:700;margin:0}
.sec .cnt{background:var(--card);border:1px solid var(--line);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:20px}
.sec.bad h2{color:#ff9d9a} .sec.warn h2{color:var(--gold2)}

/* ===== صف الأيقونة (واحدة في السطر) ===== */
.irow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:11px 13px;margin-bottom:9px;cursor:pointer;position:relative;
  overflow:hidden;transition:.15s}
.irow:active{transform:scale(.985)}
.irow:before{content:'';position:absolute;top:0;bottom:0;right:0;width:4px;background:#2a4c43}
.irow.bad:before{background:var(--bad)} .irow.warn:before{background:var(--warn)}
.irow.ok:before{background:var(--ok)}
.irow.bad{border-color:#4a2a28;background:linear-gradient(90deg,#1d1413,var(--card) 55%)}
.irow.warn{border-color:#473c1f;background:linear-gradient(90deg,#1c1a11,var(--card) 55%)}
.irow .ic{flex:0 0 auto;width:54px;height:54px;display:grid;place-items:center;font-size:30px}
.irow .ic img{width:54px;height:54px;object-fit:contain;border-radius:15px;display:block}
.irow .mid{flex:1;min-width:0}
.irow .nm{font-weight:600;font-size:15px;line-height:1.3}
.irow .sb{color:var(--muted);font-size:11.5px;margin-top:3px}
.irow .nm{font-size:16px}
.irow .dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:#2a4c43}
.irow.bad .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(217,83,79,.16)}
.irow.warn .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(214,178,74,.14)}
.irow.ok .dot{background:var(--ok)}
.irow .arw{color:#3c6557;font-size:17px;margin-inline-start:4px}

/* ===== allgood ===== */
.allgood{background:linear-gradient(135deg,#123b2e,var(--card));border:1px solid #235c47;
  border-radius:var(--r);padding:26px 18px;text-align:center}
.allgood .big{font-size:42px;display:block;margin-bottom:8px}
.allgood b{font-size:16px;display:block;margin-bottom:5px}
.allgood small{color:var(--muted);font-size:12.5px}

/* ===== rows / logs ===== */
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  display:flex;gap:11px;align-items:flex-start}
.row .ic{font-size:19px;line-height:1.2;flex:0 0 auto}
.row .ic img{width:34px;height:34px;object-fit:contain;border-radius:10px;display:block}
.sheet h3 .ic img{width:46px;height:46px;border-radius:13px;object-fit:contain;display:block}
.row .nm{font-weight:600;font-size:14px}
.row .ln{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.75}
.row .end{margin-inline-start:auto;text-align:start;flex:0 0 auto}
.cost{font-weight:700;font-size:13px;color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#16332c;color:#9ec9b9;border-radius:7px;padding:2px 8px;font-size:10.5px;font-weight:600}
.pill.bad{background:#3a1e1d;color:#ff9d9a} .pill.warn{background:#38311a;color:#f0cc6a}
.pill.unknown{background:#1b2c28;color:#7e9a92}
.bar{height:5px;background:#17302a;border-radius:20px;overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;border-radius:20px;background:#2a4c43;transition:width .4s}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

/* ===== chips ===== */
.chips{display:flex;gap:8px;margin-bottom:13px}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.chip b{display:block;font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:11px}
.chip.g b{color:var(--gold2)}

/* ===== forms ===== */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;background:#0b1a16;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--em)}
input[type=file]{padding:8px}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card>h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.tiny{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.note{background:rgba(214,178,74,.08);border:1px solid rgba(214,178,74,.28);color:#e8d49a;
  border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.75;margin-bottom:12px}
.note.g{background:rgba(23,166,115,.08);border-color:rgba(23,166,115,.3);color:#9fdcc2}

/* toggle */
.sw{position:relative;width:42px;height:24px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#1e3a33;border-radius:20px;transition:.2s}
.sw i:after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + i{background:var(--em)}
.sw input:checked + i:after{transform:translateX(-18px)}
.swrow{display:flex;align-items:center;gap:11px;padding:9px 0}
.swrow .t{flex:1}
.swrow .t b{font-weight:600;font-size:14px;display:block}
.swrow .t small{color:var(--muted);font-size:11.5px}

/* perms table */
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ptbl th,.ptbl td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.ptbl th{color:var(--muted);font-weight:600;font-size:11px}
.ptbl td:first-child,.ptbl th:first-child{text-align:start;font-weight:600}
.pb{background:transparent;border:1px solid var(--line);border-radius:8px;width:30px;height:28px;
  color:var(--muted);font-size:14px;cursor:pointer;padding:0}
.pb.on{background:rgba(23,166,115,.16);border-color:#276c56;color:#4fd3a2}
.pb.off{color:#6b4a49}
.pb:disabled{opacity:.35;cursor:default}

/* nav */
nav.tabs{position:fixed;bottom:0;right:0;left:0;background:rgba(10,20,17,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:0;border:0;color:var(--muted);padding:10px 4px 11px;font-size:11px;
  font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button i{font-size:20px;font-style:normal;line-height:1}
nav.tabs button.on{color:var(--em2)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(2,8,6,.75);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.ov.hide{display:none}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:760px;max-height:93vh;overflow:auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.handle{width:44px;height:4px;background:#28473e;border-radius:9px;margin:0 auto 13px}
.sheet h3{margin:0 0 13px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.sheet h3 .ic{font-size:26px}
.acts{display:flex;gap:9px;margin-top:8px}
.acts .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:13.5px;line-height:1.9}
.empty .big{font-size:38px;display:block;margin-bottom:8px}
.spin{width:24px;height:24px;border:3px solid #1e3a33;border-top-color:var(--em2);border-radius:50%;
  margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#shot{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:10px}
/* شاشة الدخول */
.login{position:fixed;inset:0;z-index:90;background:radial-gradient(800px 500px at 50% 0%,#123a2e,var(--bg) 60%),var(--bg);
  display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
.login.hide{display:none}
.lgbox{width:100%;max-width:380px;text-align:center}
.lglogo{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;overflow:hidden;background:#06100d;
  border:1px solid #2a6b55;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lglogo img{width:100%;height:100%;object-fit:cover;display:block}
.lgbox h2{margin:0 0 6px;font-size:21px;font-weight:700}
.lgsub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.8}
.lgbox label.f>span{text-align:start}
/* تنبيه صغير */
#toast{position:fixed;bottom:84px;right:50%;transform:translate(50%,16px);background:#16332c;color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;z-index:95;
  opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(50%,0)}
@media (max-width:400px){ .tile .nm{font-size:11px} .odo .num{font-size:30px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="app.png" alt="" onerror="this.replaceWith(document.createTextNode('🚗'))"></div>
    <div style="flex:1;min-width:0">
      <div class="ttl" id="hTtl">SKODA A4</div>
      <div class="sub" id="hSub">صيانة العربية</div>
    </div>
    <div class="who" id="hWho">المدير</div>
  </header>
  <div id="banner"></div>
  <div id="view"></div>
</div>

<nav class="tabs">
  <button data-tab="home" class="on"><i>🔧</i>الصيانة</button>
  <button data-tab="log"><i>📋</i>السجل</button>
  <button data-tab="cfg"><i>⚙️</i>الإعدادات</button>
</nav>

<div class="ov hide" id="ov"><div class="sheet" id="sheet"></div></div>

<!-- شاشة الدخول -->
<div class="login hide" id="login">
  <div class="lgbox">
    <div class="lglogo"><img src="app.png" alt="" onerror="this.parentNode.style.display='grid';this.parentNode.style.placeItems='center';this.parentNode.style.fontSize='44px';this.replaceWith(document.createTextNode('🚗'))"></div>
    <h2>صيانة سكودا A4</h2>
    <p class="lgsub">ادخل بحسابك عشان البيانات تتزامن بينك وبين اللي معاك</p>
    <div id="lgBody"></div>
  </div>
</div>

<!-- مكتبات Firebase (compat 10.12.2 — نفس مصاريف البيت) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
"use strict";
/* ══════════════ أدوات ══════════════ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>(Number(n)||0).toLocaleString('en-US');
const DAY=86400000;
const todayISO=()=>new Date().toISOString().slice(0,10);
function parseISO(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;}
function fmtDate(s){const d=parseISO(s);return d?d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear():'—';}
function addMonths(s,m){const d=parseISO(s);if(!d)return null;const day=d.getDate();
  d.setMonth(d.getMonth()+Number(m));if(d.getDate()<day)d.setDate(0);return d;}
const daysBetween=(a,b)=>Math.round((a-b)/DAY);
function fmtDur(days){days=Math.abs(days);
  if(days<31)return days+' يوم';
  const m=Math.round(days/30.44); if(m<12)return m+' شهر';
  const y=Math.floor(m/12),r=m%12; return y+' سنة'+(r?' و'+r+' شهر':'');}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ══════════════ البنود الافتراضية ══════════════
   ic = أيقونة. دلوقتي إيموچي — تتبدل بصور الأيقونات اللي هيبعتها المستخدم:
   حط رابط/ملف الصورة في icImg وهي تتعرض مكان الإيموچي تلقائيًا. */
const I='';
const DEFAULT_ITEMS=[
 {id:'oil',      img:I+'oil.png',      ic:'🛢️', nm:'زيت الموتور + الفلتر', km:5000,  mo:6,  on:true, ord:1,  tip:'المعدني كل 5000، الصناعي يوصل 10000'},
 {id:'plugs',    img:I+'plugs.png',    ic:'🔌', nm:'البوجيهات',            km:30000, mo:0,  on:true, ord:2,  tip:'النحاس 30 ألف، الإريديوم 60-90 ألف'},
 {id:'timing',   img:I+'belt.png',     ic:'⛓️', nm:'سير الكاتينة',         km:90000, mo:60, on:true, ord:3,  tip:'أهم بند — لو قطع يفضي الموتور'},
 {id:'waterpump',img:I+'waterpump.png',ic:'💧', nm:'طرمبة المياه',         km:90000, mo:0,  on:true, ord:4,  tip:'الأفضل تتغير مع سير الكاتينة'},
 {id:'airfil',   img:I+'airfil.png',   ic:'🌀', nm:'فلتر الهوا',           km:15000, mo:0,  on:true, ord:5,  tip:''},
 {id:'fuelfil',  img:I+'fuelfil.png',  ic:'⛽', nm:'فلتر البنزين',         km:30000, mo:0,  on:true, ord:6,  tip:''},
 {id:'cabfil',   img:I+'cabfil.png',   ic:'❄️', nm:'فلتر التكييف',         km:15000, mo:12, on:true, ord:7,  tip:''},
 {id:'acgas',    img:I+'acgas.png',    ic:'❄️', nm:'غاز التكييف',          km:0,     mo:24, on:true, ord:8,  tip:'يتشحن لما التبريد يضعف'},
 {id:'gearoil',  img:I+'gearoil.png',  ic:'⚙️', nm:'زيت الفتيس',           km:60000, mo:0,  on:true, ord:9,  tip:'الأوتوماتيك كل 60 ألف'},
 {id:'padsF',    img:I+'pads.png',     ic:'🧱', nm:'تيل الفرامل الأمامي',  km:35000, mo:0,  on:true, ord:10, tip:''},
 {id:'padsR',    img:I+'pads.png',     ic:'🧱', nm:'تيل الفرامل الخلفي',   km:60000, mo:0,  on:true, ord:11, tip:''},
 {id:'battery',  img:I+'battery.png',  ic:'🔋', nm:'البطارية',             km:0,     mo:36, on:true, ord:12, tip:''},
 {id:'tiresF',   img:I+'tires.png',    ic:'🛞', nm:'كاوتش أمامي',          km:50000, mo:60, on:true, ord:13, tip:'يتغير بالعمر كمان'},
 {id:'tiresR',   img:I+'tires.png',    ic:'🛞', nm:'كاوتش خلفي',           km:50000, mo:60, on:true, ord:14, tip:'يتغير بالعمر كمان'}
];
const WARN_KM=1000;    /* ينوّر برتقالي قبل الميعاد بـ 1000 كم */
const WARN_DAYS=30;    /* وللبنود اللي بالوقت: قبل الميعاد بشهر */
const DEFAULT_CAR={nm:'SKODA A4',plate:'',year:'',odo:0,odoDate:todayISO(),avg:1500,
  bio:false};

/* صفحات الصلاحيات — زي PERM_ROWS في مصاريف البيت. ed=0 يعني عرض بس */
const PERM_ROWS=[
 {p:'maint', nm:'صفحة الصيانة',        ed:0},
 {p:'odo',   nm:'تحديث العداد',        ed:1},
 {p:'addlog',nm:'تسجيل غيار',          ed:1},
 {p:'log',   nm:'السجل والمواعيد',     ed:0},
 {p:'items', nm:'تعديل البنود والمدد', ed:1},
 {p:'car',   nm:'بيانات العربية',      ed:1},
 {p:'costs', nm:'المصاريف والتكاليف',  ed:0},
 {p:'backup',nm:'النسخة الاحتياطية',   ed:1}
];
const DEF_PERMS={
  admin :{maint:'edit',odo:'edit',addlog:'edit',log:'edit',items:'edit',car:'edit',costs:'edit',backup:'edit'},
  editor:{maint:'view',odo:'edit',addlog:'edit',log:'view',items:'none',car:'view',costs:'view',backup:'none'},
  viewer:{maint:'view',odo:'none',addlog:'none',log:'view',items:'none',car:'none',costs:'none',backup:'none'}
};
const ROLE_NM={admin:'المدير',editor:'محرر',viewer:'مشاهد'};

/* ══════════════ الحالة ══════════════ */
let CAR=Object.assign({},DEFAULT_CAR);
let ITEMS=[], LOGS=[], USERS=[], PERMS=JSON.parse(JSON.stringify(DEF_PERMS));

const LS='skodaA4.v1';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({car:CAR,items:ITEMS,logs:LOGS,users:USERS,perms:PERMS}));}catch(e){}}
function lsLoad(){try{const r=localStorage.getItem(LS);if(!r)return false;const d=JSON.parse(r);

  if(d.items)ITEMS=d.items; if(d.logs)LOGS=d.logs; if(d.users)USERS=d.users;

/* الصلاحيات */
function mergePerms(src){
  PERMS=JSON.parse(JSON.stringify(DEF_PERMS));
  Object.keys(src||{}).forEach(r=>{if(PERMS[r])Object.assign(PERMS[r],src[r]);});
}
const permOf=p=>(PERMS[ROLE]&&PERMS[ROLE][p])||'none';
const canSee =p=>permOf(p)!=='none';
const canEdit=p=>permOf(p)==='edit' && CAN_WRITE;

/* ══════════════ الكتابة: Firestore وإحنا متصلين، وإلا على الجهاز ══════════════ */
const clean=o=>JSON.parse(JSON.stringify(o));
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.className='show';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className='';},2800);
}
function writeErr(e){
  console.warn('write failed',e);
  if(e&&e.code==='permission-denied'){CAN_WRITE=false;toast('مالكش صلاحية التعديل ده');render();}
  else toast('مقدرتش أحفظ — جرّب تاني');
}
async function W(fn){
  if(MODE==='db'&&carRef){ try{ await fn(); }catch(e){ writeErr(e); } }
  else lsSave();
}
/* بيتكتب مفاتيح الـ patch بس — عشان قواعد الأمان تفرّق بين تحديث العداد وبيانات العربية */
async function saveCar(patch){Object.assign(CAR,patch);
  await W(()=>carRef.update(clean(patch)));render();}
async function saveBio(v){CAR.bio=v;try{localStorage.setItem(LS+'.bio',v?'1':'0');}catch(e){}render();}
async function saveItem(it){const i=ITEMS.findIndex(x=>x.id===it.id);if(i<0)ITEMS.push(it);else ITEMS[i]=it;
  await W(()=>carRef.collection('items').doc(it.id).set(clean(it)));render();}
async function delItem(id){ITEMS=ITEMS.filter(x=>x.id!==id);
  await W(()=>carRef.collection('items').doc(id).delete());render();}
async function addLog(lg){LOGS.push(lg);
  await W(()=>carRef.collection('logs').doc(lg.id).set(clean(lg)));render();}
async function delLog(id){LOGS=LOGS.filter(x=>x.id!==id);
  await W(()=>carRef.collection('logs').doc(id).delete());render();}
async function savePerms(){ await W(()=>carRef.update({perms:clean(PERMS)})); render(); }
async function saveUsers(){ lsSave(); render(); }

/* ══════════════ حساب حالة كل بند ══════════════ */
function itemState(it){
  const odo=Number(CAR.odo)||0;
  const lKm=(it.lastKm===''||it.lastKm==null)?null:Number(it.lastKm);
  const lDt=it.lastDate||null, iKm=Number(it.km)||0, iMo=Number(it.mo)||0;
  const now=new Date(todayISO()+'T00:00:00');
  let fracKm=null,leftKm=null,fracMo=null,leftDays=null,nextKm=null,nextDate=null;
  if(iKm>0&&lKm!=null){nextKm=lKm+iKm;leftKm=nextKm-odo;fracKm=(odo-lKm)/iKm;}
  if(iMo>0&&lDt){const nd=addMonths(lDt,iMo);
    if(nd){nextDate=nd;leftDays=daysBetween(nd,now);fracMo=1-(leftDays/(iMo*30.44));}}
  const known=(fracKm!=null||fracMo!=null);
  const frac=known?Math.max(fracKm==null?-9:fracKm,fracMo==null?-9:fracMo):null;
  /* أحمر: جه ميعاده أو فات. برتقالي: فاضل 1000 كم أو أقل (أو شهر أو أقل للبنود بالوقت) */
  let st='unknown';
  if(known){
    const kmDue  = leftKm!=null   && leftKm<=0;
    const dtDue  = leftDays!=null && leftDays<=0;
    const kmNear = leftKm!=null   && leftKm<=WARN_KM;
    const dtNear = leftDays!=null && leftDays<=WARN_DAYS;
    st=(kmDue||dtDue)?'bad':((kmNear||dtNear)?'warn':'ok');
  }
  let estDays=null; const avg=Number(CAR.avg)||0;
  if(leftKm!=null&&avg>0)estDays=Math.round(leftKm/avg*30.44);
  return {st,frac:known?Math.max(0,Math.min(frac,1.3)):0,leftKm,leftDays,nextKm,nextDate,estDays,known};
}
function shortStat(s){
  if(!s.known) return 'مش مسجّل';
  if(s.leftKm!=null&&s.leftKm<0) return 'فات '+nf(-s.leftKm)+' كم';
  if(s.leftDays!=null&&s.leftDays<0) return 'فات '+fmtDur(s.leftDays);
  if(s.leftKm!=null) return nf(s.leftKm)+' كم';
  if(s.leftDays!=null) return fmtDur(s.leftDays);
  return '';
}
const liveItems=()=>ITEMS.filter(i=>i.on!==false);
function byUrgency(a,b){const A=itemState(a),B=itemState(b);
  const r=s=>s.st==='bad'?0:s.st==='warn'?1:s.st==='unknown'?2:3;
  if(r(A)!==r(B))return r(A)-r(B);
  if(A.known&&B.known)return B.frac-A.frac;
  return (a.ord||99)-(b.ord||99);}
const itemById=id=>ITEMS.find(i=>i.id===id);
const IV='?v=2';   /* يزيد مع كل تغيير في الأيقونات عشان الكاش */
const icOf=it=>{
  const em=(it&&it.ic)||'🔧', src=it&&(it.img||it.icImg);
  /* لو الصورة مش موجودة بيرجع للإيموچي بدل ما يبان مربع فاضي */
  return src?'<img src="'+esc(src)+IV+'" alt="" loading="lazy" onerror="this.onerror=null;'
    +'this.replaceWith(document.createTextNode(\''+em+'\'))">':esc(em);
};

/* صفحة الصيانة: أيقونة واسم البند بس — التفاصيل تتفتح بالضغط */
function tiles(list){
  return list.map(it=>{
    const s=itemState(it);
    return '<div class="irow '+s.st+'" data-id="'+esc(it.id)+'">'
      +'<div class="ic">'+icOf(it)+'</div>'
      +'<div class="mid"><div class="nm">'+esc(it.nm)+'</div></div>'
      +'<span class="dot"></span><span class="arw">‹</span></div>';
  }).join('');
}

    h+='<div class="row"><div class="ic">'+icOf(it)+'</div>'
     + '<div style="flex:1;min-width:0"><div class="nm">'+esc(l.nm||(it&&it.nm)||'صيانة')+'</div>'
     + '<div class="ln">'+nf(l.km)+' كم · '+fmtDate(l.date)
     +  (l.by?' · <span class="pill">'+esc(l.by)+'</span>':'')
     +  (l.place?'<br>📍 '+esc(l.place):'')+(l.notes?'<br>'+esc(l.notes):'')+'</div></div>'
     + '<div class="end">'+(money&&Number(l.cost)?'<div class="cost">'+nf(l.cost)+' ج</div>':'')
     +  (canEdit('addlog')?'<button class="btn sm danger" style="margin-top:6px" data-a="dl" data-id="'+esc(l.id)+'">حذف</button>':'')
     + '</div></div>';});
  $('#view').innerHTML=h;
  const nb=$('#view [data-a="new"]'); if(nb)nb.onclick=()=>shLog(null);
  const ni=$('#view [data-a="ni"]'); if(ni)ni.onclick=shNewItem;
  $$('#view .row[data-id]').forEach(r=>r.onclick=()=>shItem(r.dataset.id));

function setOdo(v,d){
  const patch={odo:v,odoDate:d};
  const pD=parseISO(CAR.odoDate),nD=parseISO(d),pO=Number(CAR.odo)||0;
  if(pD&&nD&&v>pO){const days=daysBetween(nD,pD);
    if(days>=20){const pm=Math.round((v-pO)/days*30.44); if(pm>50&&pm<20000)patch.avg=pm;}}
  return saveCar(patch);
}

function shCam(){
  open_('<h3><span class="ic">📷</span>صوّر العداد</h3>'
  +'<div class="note g">صوّر شاشة العداد قريّب وواضح. البرنامج هيقرا الرقم ويوريهولك تأكّده قبل الحفظ.</div>'
  +'<label class="f"><span>الصورة</span><input type="file" id="cF" accept="image/*" capture="environment"></label>'
  +'<div id="cOut"></div>'
  +'<div class="acts"><button class="btn ghost" id="cX">إلغاء</button></div>');
  $('#cX').onclick=close_;
  $('#cF').onchange=()=>{const f=$('#cF').files[0]; if(f)readOdo(f);};
}
function readOdo(file){
  const out=$('#cOut'), url=URL.createObjectURL(file);
  out.innerHTML='<img id="shot" src="'+url+'"><div class="empty" style="padding:14px"><div class="spin"></div>بقرا الرقم…</div>';
  loadOCR().then(T=>T.recognize(file,'eng',{tessedit_char_whitelist:'0123456789'}))
    .then(res=>{
      const txt=(res&&res.data&&res.data.text)||'';
      const cands=(txt.match(/\d{3,7}/g)||[]).map(Number)
        .filter(n=>n>=(Number(CAR.odo)||0)-50000 && n<2000000)
        .sort((a,b)=>b-a);
      showOdoConfirm(url,cands[0]||'');
    })
    .catch(()=>showOdoConfirm(url,'',true));
}
function showOdoConfirm(url,val,failed){
  $('#cOut').innerHTML='<img id="shot" src="'+url+'">'
    +(failed?'<div class="note">مقدرتش أقرا الرقم من الصورة — اكتبه بنفسك تحت.</div>'
            :'<div class="note g">الرقم اللي قريته — راجعه وعدّله لو فيه غلط.</div>')
    +'<label class="f"><span>قراءة العداد</span><input id="cV" inputmode="numeric" value="'+esc(val)+'"></label>'
    +'<label class="f"><span>التاريخ</span><input id="cD" type="date" value="'+todayISO()+'"></label>'
    +'<div class="acts"><button class="btn ghost" id="cX2">إلغاء</button><button class="btn gold" id="cS">تأكيد وحفظ</button></div>';
  $('#cX2').onclick=close_;
  $('#cS').onclick=()=>{const v=parseInt($('#cV').value,10);
    if(isNaN(v)||v<0){alert('اكتب رقم العداد');return;}
    setOdo(v,$('#cD').value||todayISO());close_();};
  const i=$('#cV'); if(i&&!val)i.focus();
}
let _ocr=null;
function loadOCR(){
  if(_ocr)return _ocr;
  _ocr=new Promise((res,rej)=>{
    if(window.Tesseract)return res(window.Tesseract);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('no lib'));
    s.onerror=()=>rej(new Error('offline'));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error('timeout')),20000);
  });
  return _ocr;
}

const DROP=['altbelt','washer','general','align','coolant','radiator','check','brakeoil','tires'];
function normalize(){
  ITEMS=ITEMS.filter(it=>DROP.indexOf(it.id)<0);

}

function showLogin(state){
  const el=$('#login'); if(!el)return;
  el.classList.remove('hide');
  $('#lgBody').innerHTML = state || loginForm();
  wireLogin();
}
function hideLogin(){ const el=$('#login'); if(el)el.classList.add('hide'); }
function loginForm(){
  return '<label class="f"><span>اسم المستخدم</span><input id="luU" autocomplete="username" placeholder="اسم المستخدم"></label>'
    +'<label class="f"><span>كلمة السر</span><input id="luP" type="password" autocomplete="current-password" placeholder="••••••"></label>'
    +'<button class="btn block" id="luGo">دخول</button>'
    +'<div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12px">'
    +'<span style="flex:1;height:1px;background:var(--line)"></span>أو<span style="flex:1;height:1px;background:var(--line)"></span></div>'
    +'<button class="btn ghost block" id="luG">الدخول بحساب جوجل</button>'
    +'<div id="luErr" class="note" style="display:none;margin-top:12px"></div>'
    +'<button class="btn ghost block" id="luOff" style="margin-top:14px;border:0;color:var(--muted);font-size:12.5px">استخدام من غير حساب (على الجهاز ده بس)</button>';
}
function loginErr(t){ const e=$('#luErr'); if(e){e.style.display='block';e.textContent=t;} }
function wireLogin(){
  const go=$('#luGo'); if(go)go.onclick=doUserLogin;
  const p=$('#luP'); if(p)p.onkeydown=e=>{if(e.key==='Enter')doUserLogin();};
  const g=$('#luG'); if(g)g.onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    g.disabled=true;
    try{ await AUTH.signInWithPopup(p); }
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/cancelled-popup-request')){
        try{ await AUTH.signInWithRedirect(p); return; }catch(e2){}
      }
      g.disabled=false;
      if(e&&e.code!=='auth/popup-closed-by-user') loginErr('مقدرتش أدخل بجوجل — جرّب تاني');
    }
  };
  const off=$('#luOff'); if(off)off.onclick=()=>startLocal('شغّال على الجهاز ده بس');
}
async function doUserLogin(){
  const u=($('#luU').value||'').trim().toLowerCase(), pw=$('#luP').value||'';
  if(!u||!pw){loginErr('اكتب اسم المستخدم وكلمة السر');return;}
  $('#luGo').disabled=true;
  try{
    const snap=await FS.collection('carUsernames').doc(u).get();
    if(!snap.exists){loginErr('اسم المستخدم ده مش موجود');$('#luGo').disabled=false;return;}
    await AUTH.signInWithEmailAndPassword(snap.data().email,pw);
  }catch(e){
    loginErr(e&&e.code==='auth/wrong-password'?'كلمة السر غلط':'مقدرتش أدخل — راجع البيانات');
    $('#luGo').disabled=false;
  }
}
function doLogout(){ try{AUTH.signOut();}catch(e){} location.reload(); }

function unsubAll(){ UNSUB.forEach(f=>{try{f();}catch(e){}}); UNSUB=[]; }

function roleOf(c){
  if(!c)return 'viewer';
  if(fbUser && c.owner===fbUser.uid) return 'admin';
  return (c.roles&&c.roles[MYEMAIL])||'';
}
function usersFromCar(c){
  const roles=(c&&c.roles)||{}, names=(c&&c.names)||{}, unames=(c&&c.unames)||{};
  return Object.keys(roles).map(em=>({id:em,email:em,name:names[em]||em,
    un:unames[em]||'',role:roles[em],owner:c.owner&&c.uids&&c.uids[em]===c.owner}));
}

async function attachCar(){
  carRef=FS.collection('cars').doc(CAR_ID);
  let snap;
  try{ snap=await carRef.get(); }
  catch(e){ showLogin('<div class="note">مقدرتش أوصل للبيانات. اتأكد إن قواعد الأمان اتنشرت.</div>'
      +'<button class="btn ghost block" id="luOff" style="margin-top:12px">استخدام على الجهاز ده</button>');
    wireLogin(); return; }

  if(!snap.exists){
    /* أول مرة: اللي فتح البرنامج يبقى صاحبه */
    const base={owner:fbUser.uid, ownerEmail:MYEMAIL, nm:'SKODA A4', plate:'', year:'',
      odo:0, odoDate:todayISO(), avg:1500,
      roles:{[MYEMAIL]:'admin'}, names:{[MYEMAIL]:MYNAME||'المدير'}, unames:{}, uids:{[MYEMAIL]:fbUser.uid},
      perms:clean(DEF_PERMS), createdAt:Date.now()};
    try{
      await carRef.set(base);
      const b=FS.batch();
      DEFAULT_ITEMS.forEach(d=>b.set(carRef.collection('items').doc(d.id),
        clean(Object.assign({lastKm:null,lastDate:''},d))));
      await b.commit();
    }catch(e){
      showLogin('<div class="note">مقدرتش أعمل بيانات العربية. اتأكد من قواعد الأمان.</div>');
      return;
    }
    snap=await carRef.get();
  }

  const c=snap.data();
  const r=roleOf(c);
  if(!r){
    showLogin('<div class="note">الحساب ده (<b>'+esc(MYEMAIL)+'</b>) مضافش للعربية دي.<br>قول للمدير يضيفك من الإعدادات.</div>'
      +'<button class="btn ghost block" id="luOut" style="margin-top:12px">خروج</button>');
    const o=$('#luOut'); if(o)o.onclick=doLogout;
    return;
  }
  ROLE=r; MODE='db'; CAN_WRITE=true; hideLogin();

  /* خروج إجباري لكل الأجهزة */
  let lastForce=0; try{lastForce=+(localStorage.getItem(LS+'.force')||0);}catch(e){}
  if(c.forceExit && c.forceExit>lastForce && c.forceExit>Date.now()-86400000*3){
    try{localStorage.setItem(LS+'.force',String(c.forceExit));}catch(e){}
    doLogout(); return;
  }

  unsubAll();
  UNSUB.push(carRef.onSnapshot(s=>{
    if(!s.exists)return;
    const d=s.data();
    CAR=Object.assign({},DEFAULT_CAR,{nm:d.nm,plate:d.plate,year:d.year,odo:d.odo,
      odoDate:d.odoDate,avg:d.avg});
    try{CAR.bio=localStorage.getItem(LS+'.bio')==='1';}catch(e){}
    if(d.perms)mergePerms(d.perms);
    USERS=usersFromCar(d);
    const nr=roleOf(d); if(nr)ROLE=nr;
    LOADED.car=1; render();
  },e=>console.warn(e)));

  UNSUB.push(carRef.collection('items').onSnapshot(s=>{
    ITEMS=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    normalize(); LOADED.items=1; render();
  },e=>console.warn(e)));

  UNSUB.push(carRef.collection('logs').onSnapshot(s=>{
    LOGS=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    LOADED.logs=1; render();
  },e=>console.warn(e)));
}

/* ── إدارة المستخدمين (المدير) ── */
async function createUser(name,username,pw,role){
  username=(username||'').trim().toLowerCase();
  if(!/^[a-z0-9._-]{3,}$/.test(username)) throw new Error('اسم المستخدم لازم يكون حروف إنجليزي وأرقام، 3 على الأقل');
  if(pw.length<6) throw new Error('كلمة السر لازم 6 حروف على الأقل');
  const taken=await FS.collection('carUsernames').doc(username).get();
  if(taken.exists) throw new Error('اسم المستخدم ده مستعمل');
  if(!SEC) SEC=firebase.initializeApp(window.FB_CONFIG,'sec');
  const email=username+'.'+Math.random().toString(36).slice(2,6)+SYNTH;
  const cred=await SEC.auth().createUserWithEmailAndPassword(email,pw);
  const uid=cred.user.uid;
  try{ await SEC.auth().signOut(); }catch(e){}
  await FS.collection('carUsernames').doc(username).set({email:email,car:CAR_ID});
  await FS.collection('carLogins').doc(uid).set({car:CAR_ID,email:email});
  const u={};
  u['roles.'+email]=role; u['names.'+email]=name||username;
  u['unames.'+email]=username; u['uids.'+email]=uid;
  u.emails=firebase.firestore.FieldValue.arrayUnion(email);
  await carRef.update(u);
}
async function updateUser(email,name,role){
  const u={}; u['roles.'+email]=role; u['names.'+email]=name;
  await carRef.update(u);
}
async function removeUser(email,username){
  const u={};
  u['roles.'+email]=firebase.firestore.FieldValue.delete();
  u['names.'+email]=firebase.firestore.FieldValue.delete();
  u['unames.'+email]=firebase.firestore.FieldValue.delete();
  u['uids.'+email]=firebase.firestore.FieldValue.delete();
  u.emails=firebase.firestore.FieldValue.arrayRemove(email);
  await carRef.update(u);
  if(username) await FS.collection('carUsernames').doc(username).delete().catch(()=>{});
}
async function forceExitAll(){
  await carRef.update({forceExit:Date.now()});
  toast('كل الأجهزة هتتقفل وتفتح على آخر نسخة');
}

/* ── متابعة نسخة البرنامج (زي مصاريف البيت) ── */
let MY_VER=null;
async function checkVersion(){
  try{
    const t=await fetch('./sw.js?x='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const m=t.match(/VERSION\s*=\s*"([^"]+)"/);
    if(!m)return;
    if(MY_VER===null){MY_VER=m[1];return;}
    if(m[1]!==MY_VER) location.reload();
  }catch(e){}
}

/* ── الإقلاع ── */
(function boot(){
  lsLoad(); normalize();
  try{CAR.bio=localStorage.getItem(LS+'.bio')==='1';}catch(e){}

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    checkVersion();
    setInterval(checkVersion,600000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
  }

  if(!cfgReady()||typeof firebase==='undefined'){ startLocal(); return; }

  try{
    firebase.initializeApp(window.FB_CONFIG);
    FS=firebase.firestore(); AUTH=firebase.auth();
    FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){ startLocal(); return; }

  render();
  AUTH.onAuthStateChanged(u=>{
    fbUser=u||null;
    if(!u){ unsubAll(); carRef=null; MODE='loading'; showLogin(); render(); return; }
    MYEMAIL=u.email||''; MYNAME=u.displayName||'';
    attachCar();
  });
})();
</script>
