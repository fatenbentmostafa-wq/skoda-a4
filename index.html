<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1411">
<title>SKODA A4 — صيانة العربية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="app-192.png">
<link rel="apple-touch-icon" href="app-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1411; --bg2:#0d1a16; --card:#102320; --card2:#15302a; --line:#1e3a33;
  --txt:#eaf3ef; --muted:#88a69c;
  --em:#17a673; --em2:#22c88c; --gold:#d6b24a; --gold2:#f0cc6a;
  --ok:#17a673; --warn:#d6b24a; --bad:#d9534f;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(900px 500px at 50% -15%, #123a2e 0%, var(--bg) 60%) no-repeat, var(--bg);
  color:var(--txt); font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh; padding:0 0 86px; font-size:15px;
}
.wrap{max-width:760px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
/* شريط الساعة والشبكة فوق: مساحة فاضية بلون الخلفية عشان المحتوى مايدخلش تحته */
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== header ===== */
header.top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.brand{width:46px;height:46px;border-radius:50%;background:#06100d;
  border:1px solid #2a6b55;display:grid;place-items:center;font-size:21px;flex:0 0 auto;overflow:hidden}
.brand img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{font-weight:700;font-size:17px;line-height:1.25}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.who{background:#13302a;border:1px solid var(--line);color:var(--gold2);border-radius:20px;
  padding:5px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}

/* ===== odometer ===== */
.odo{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;margin-bottom:14px}
.odo .lbl{color:var(--muted);font-size:12px;letter-spacing:.3px}
.odo .num{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-top:2px;
  font-variant-numeric:tabular-nums}
.odo .num span{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:5px}
.odo .meta{color:var(--muted);font-size:11px;margin-top:6px}
.odo .acts{display:flex;gap:8px;margin-top:12px}
.odo .acts .btn{flex:1}

/* ===== buttons ===== */
.btn{background:var(--em);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;
  font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#2b2100}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:transparent;border:1px solid #4a2a28;color:#f0908d}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== section heads ===== */
.sec{display:flex;align-items:center;gap:8px;margin:18px 3px 11px}
.sec h2{font-size:13.5px;font-weight:700;margin:0}
.sec .cnt{background:var(--card);border:1px solid var(--line);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:20px}
.sec.bad h2{color:#ff9d9a} .sec.warn h2{color:var(--gold2)}

/* ===== صف الأيقونة (واحدة في السطر) ===== */
.irow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:11px 13px;margin-bottom:9px;cursor:pointer;position:relative;
  overflow:hidden;transition:.15s}
.irow:active{transform:scale(.985)}
.irow:before{content:'';position:absolute;top:0;bottom:0;right:0;width:4px;background:#2a4c43}
.irow.bad:before{background:var(--bad)} .irow.warn:before{background:var(--warn)}
.irow.ok:before{background:var(--ok)}
.irow.bad{border-color:#4a2a28;background:linear-gradient(90deg,#1d1413,var(--card) 55%)}
.irow.warn{border-color:#473c1f;background:linear-gradient(90deg,#1c1a11,var(--card) 55%)}
.irow .ic{flex:0 0 auto;width:54px;height:54px;display:grid;place-items:center;font-size:30px}
.irow .ic img{width:54px;height:54px;object-fit:contain;border-radius:15px;display:block}
.irow .mid{flex:1;min-width:0}
.irow .nm{font-weight:600;font-size:15px;line-height:1.3}
.irow .sb{color:var(--muted);font-size:11.5px;margin-top:3px}
.irow .nm{font-size:16px}
.irow .dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:#2a4c43}
.irow.bad .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(217,83,79,.16)}
.irow.warn .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(214,178,74,.14)}
.irow.ok .dot{background:var(--ok)}
.irow .arw{color:#3c6557;font-size:17px;margin-inline-start:4px}

/* ===== allgood ===== */
.allgood{background:linear-gradient(135deg,#123b2e,var(--card));border:1px solid #235c47;
  border-radius:var(--r);padding:26px 18px;text-align:center}
.allgood .big{font-size:42px;display:block;margin-bottom:8px}
.allgood b{font-size:16px;display:block;margin-bottom:5px}
.allgood small{color:var(--muted);font-size:12.5px}

/* ===== rows / logs ===== */
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  display:flex;gap:11px;align-items:flex-start}
.row .ic{font-size:19px;line-height:1.2;flex:0 0 auto}
.row .ic img{width:34px;height:34px;object-fit:contain;border-radius:10px;display:block}
.sheet h3 .ic img{width:46px;height:46px;border-radius:13px;object-fit:contain;display:block}
.row .nm{font-weight:600;font-size:14px}
.row .ln{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.75}
.row .end{margin-inline-start:auto;text-align:start;flex:0 0 auto}
.cost{font-weight:700;font-size:13px;color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#16332c;color:#9ec9b9;border-radius:7px;padding:2px 8px;font-size:10.5px;font-weight:600}
.pill.bad{background:#3a1e1d;color:#ff9d9a} .pill.warn{background:#38311a;color:#f0cc6a}
.pill.unknown{background:#1b2c28;color:#7e9a92}
.bar{height:5px;background:#17302a;border-radius:20px;overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;border-radius:20px;background:#2a4c43;transition:width .4s}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

/* ===== chips ===== */
.chips{display:flex;gap:8px;margin-bottom:13px}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.chip b{display:block;font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-size:11px}
.chip.g b{color:var(--gold2)}

/* ===== forms ===== */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;background:#0b1a16;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--em)}
input[type=file]{padding:8px}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card>h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.tiny{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.note{background:rgba(214,178,74,.08);border:1px solid rgba(214,178,74,.28);color:#e8d49a;
  border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.75;margin-bottom:12px}
.note.g{background:rgba(23,166,115,.08);border-color:rgba(23,166,115,.3);color:#9fdcc2}

/* toggle */
.sw{position:relative;width:42px;height:24px;flex:0 0 auto}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#1e3a33;border-radius:20px;transition:.2s}
.sw i:after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + i{background:var(--em)}
.sw input:checked + i:after{transform:translateX(-18px)}
.swrow{display:flex;align-items:center;gap:11px;padding:9px 0}
.swrow .t{flex:1}
.swrow .t b{font-weight:600;font-size:14px;display:block}
.swrow .t small{color:var(--muted);font-size:11.5px}

/* perms table */
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ptbl th,.ptbl td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.ptbl th{color:var(--muted);font-weight:600;font-size:11px}
.ptbl td:first-child,.ptbl th:first-child{text-align:start;font-weight:600}
/* علامات الصح والغلط — نفس شكل مصاريف البيت */
.pb{width:36px;height:31px;border-radius:9px;border:1px solid var(--line);background:#0b1a16;font-family:inherit;
  font-weight:800;font-size:16px;line-height:1;display:inline-grid;place-items:center;padding:0;cursor:pointer;color:var(--muted)}
.pb.on{color:#3DD9B3;border-color:rgba(61,217,179,.55);background:rgba(61,217,179,.12)}
.pb.off{color:#FF6B6B;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.10)}
.pb:disabled{opacity:.35;border-style:dashed;cursor:default}

/* nav */
nav.tabs{position:fixed;bottom:0;right:0;left:0;background:rgba(10,20,17,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:0;border:0;color:var(--muted);padding:10px 4px 11px;font-size:11px;
  font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button i{font-size:20px;font-style:normal;line-height:1}
nav.tabs button.on{color:var(--em2)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(2,8,6,.75);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.ov.hide{display:none}
html.nosc,html.nosc body{overflow:hidden!important;overscroll-behavior:none}
.ov,.ov .sheet{overscroll-behavior:contain}
.sheet{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:760px;max-height:93vh;overflow:auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.handle{width:44px;height:4px;background:#28473e;border-radius:9px;margin:0 auto 13px}
.sheet h3{margin:0 0 13px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.sheet h3 .ic{font-size:26px}
.acts{display:flex;gap:9px;margin-top:8px}
.acts .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:13.5px;line-height:1.9}
.empty .big{font-size:38px;display:block;margin-bottom:8px}
.spin{width:24px;height:24px;border:3px solid #1e3a33;border-top-color:var(--em2);border-radius:50%;
  margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#shot{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:10px}
/* شاشة الدخول */
.login{position:fixed;inset:0;z-index:90;background:radial-gradient(800px 500px at 50% 0%,#123a2e,var(--bg) 60%),var(--bg);
  display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
.login.hide{display:none}
.lgbox{width:100%;max-width:380px;text-align:center}
.lglogo{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;overflow:hidden;background:#06100d;
  border:1px solid #2a6b55;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lglogo img{width:100%;height:100%;object-fit:cover;display:block}
.lgbox h2{margin:0 0 6px;font-size:21px;font-weight:700}
.lgsub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.8}
.lgbox label.f>span{text-align:start}
/* تنبيه صغير */
#toast{position:fixed;bottom:84px;right:50%;transform:translate(50%,16px);background:#16332c;color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;z-index:95;
  opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(50%,0)}
@media (max-width:400px){ .tile .nm{font-size:11px} .odo .num{font-size:30px} }

/* ===== جرس الإشعارات ===== */
.hbtn{position:relative;width:42px;height:42px;border-radius:50%;background:#13302a;border:1px solid var(--line);
  color:var(--txt);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.hbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hbtn.spin svg{animation:sp .8s linear infinite}
.hbtn .badge{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.nf-sec{color:var(--muted);font-size:12px;font-weight:700;margin:16px 3px 8px}
.nf{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;width:100%;text-align:start;color:var(--txt);font-family:inherit}
.nf .ic{font-size:20px;line-height:1.2;flex:0 0 auto}
.nf .ic img{width:32px;height:32px;object-fit:contain;border-radius:9px;display:block}
.nf .t{font-weight:600;font-size:13.5px;line-height:1.5}
.nf .b{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.7}
.nf .act{display:inline-block;margin-top:7px;background:var(--em);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.nf.unread{border-color:#2b6b55;background:linear-gradient(90deg,#123a2e,var(--card) 60%)}
.nf.unread .t:after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--em2);margin-inline-start:7px;vertical-align:middle}
.nf.alert{border-color:#4a2a28}
/* ===== رأس الصفحات الفرعية ===== */
.pghead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.pghead h2{flex:1;margin:0;font-size:19px;font-weight:700}
.backbtn{background:transparent;border:1px solid #2a6b55;color:var(--em2);border-radius:22px;padding:8px 14px;
  font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
/* ===== اختيار نوع الحساب ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0b1a16;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px}
.seg button{background:transparent;border:0;color:var(--muted);border-radius:10px;padding:10px 6px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--em2);color:#06231a}
/* ===== قفل البصمة ===== */
.lockscreen{position:fixed;inset:0;z-index:99;background:radial-gradient(800px 500px at 50% 0%,#123a2e,var(--bg) 60%),var(--bg);
  display:flex;align-items:center;justify-content:center;padding:22px}
html.locked body>.wrap, html.locked nav.tabs{visibility:hidden}
.lockic{width:58px;height:58px;border-radius:17px;background:#123a2e;display:grid;place-items:center;font-size:28px;flex:0 0 auto}
.lockrow{display:flex;gap:12px;align-items:flex-start}
/* ===== نافذة البند: الجاي واضح ===== */
.ishd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ishic{flex:0 0 auto;font-size:34px;line-height:1}
.ishic img{width:56px;height:56px;border-radius:15px;object-fit:contain;display:block}
.ishnm{font-size:18px;font-weight:700;line-height:1.3}
.nxlbl{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.nxt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.nxt.one{grid-template-columns:1fr}
.nxb{background:#0b1a16;border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.nxb .l{font-size:12px;color:var(--muted)}
.nxb .v{font-size:23px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.2}
.nxb .s{font-size:12px;color:var(--muted)}
.nxb.ok .v{color:#4fd3a2}
.nxb.bad{border-color:#4a2a28;background:#1d1413} .nxb.bad .v,.nxb.bad .s{color:#ff9d9a}
.nxb.warn{border-color:#473c1f;background:#1c1a11} .nxb.warn .v,.nxb.warn .s{color:var(--gold2)}
.lastln{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
/* ===== اختيار البند بالصور (تسجيل غيار) ===== */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;max-height:300px;overflow:auto;padding:2px}
.pk1{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;font-family:inherit;color:var(--txt);font-size:11.5px;line-height:1.3;text-align:center}
.pk1 .ic{font-size:28px;line-height:1}
.pk1 .ic img{width:42px;height:42px;object-fit:contain;border-radius:10px;display:block}
.pk1.on{border-color:var(--em2);background:rgba(23,166,115,.16);box-shadow:inset 0 0 0 1px var(--em2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="app.png" alt="SKODA"></div>
    <div style="flex:1;min-width:0">
      <div class="ttl" id="hTtl">SKODA A4</div>
      <div class="sub" id="hSub">صيانة العربية</div>
    </div>
    <div class="who" id="hWho">المدير</div>
    <button class="hbtn" id="rfBtn" aria-label="تحديث من السيرفر" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="hbtn" id="bellBtn" aria-label="الإشعارات" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge hidden" id="bellN">0</span>
    </button>
  </header>
  <div id="banner"></div>
  <div id="view"></div>
</div>

<nav class="tabs">
  <button data-tab="home" class="on"><i>🔧</i>الصيانة</button>
  <button data-tab="log"><i>📋</i>السجل</button>
  <button data-tab="done"><i>🧾</i>اللي اتعمل</button>
  <button data-tab="cfg"><i>⚙️</i>الإعدادات</button>
</nav>

<div class="ov hide" id="ov"><div class="sheet" id="sheet"></div></div>

<!-- شاشة الدخول -->
<div class="login hide" id="login">
  <div class="lgbox">
    <div class="lglogo"><img src="app.png" alt=""></div>

/* التاريخ بالتوقيت المحلي (مصر) — toISOString بيحسب بتوقيت جرينتش فبيرجّع يوم ورا بعد نص الليل */
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO=()=>isoOf(new Date());
function parseISO(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;}
function fmtDate(s){const d=parseISO(s);return d?d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear():'—';}
function addMonths(s,m){const d=parseISO(s);if(!d)return null;const day=d.getDate();
  d.setMonth(d.getMonth()+Number(m));if(d.getDate()<day)d.setDate(0);return d;}
const daysBetween=(a,b)=>Math.round((a-b)/DAY);
function fmtDur(days){days=Math.abs(days);
  if(days<31)return days+' يوم';
  const m=Math.round(days/30.44); if(m<12)return m+' شهر';
  const y=Math.floor(m/12),r=m%12; return y+' سنة'+(r?' و'+r+' شهر':'');}

 {id:'acgas',    img:I+'acgas.png',    ic:'❄️', nm:'غاز التكييف',          km:0,     mo:24, on:true, ord:8,  tip:'يتشحن لما التبريد يضعف'},
 {id:'gearoil',  img:I+'gearoil.png',  ic:'⚙️', nm:'زيت الفتيس',           km:60000, mo:0,  on:true, ord:9,  tip:'الأوتوماتيك كل 60 ألف'},
 {id:'padsF',    img:I+'pads.png',     ic:'🧱', nm:'تيل الفرامل الأمامي',  km:35000, mo:0,  on:true, ord:10, tip:''},
 {id:'padsR',    img:I+'pads.png',     ic:'🧱', nm:'تيل الفرامل الخلفي',   km:60000, mo:0,  on:true, ord:11, tip:''},

 {id:'tiresR',   img:I+'tires.png',    ic:'🛞', nm:'كاوتش خلفي',           km:50000, mo:60, on:true, ord:14, tip:'يتغير بالعمر كمان'}
];

let CAR=Object.assign({},DEFAULT_CAR);

  PERMS=JSON.parse(JSON.stringify(DEF_PERMS));

const clean=o=>JSON.parse(JSON.stringify(o));
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}

/* بيتكتب مفاتيح الـ patch بس — عشان قواعد الأمان تفرّق بين تحديث العداد وبيانات العربية */

  await W(()=>carRef.collection('items').doc(it.id).set(clean(it)));render();}

/* هل التسجيل ده أحدث من «آخر مرة» المتسجلة في البند؟ */
function isNewer(it,km,date){
  const lk=(it.lastKm===''||it.lastKm==null)?null:Number(it.lastKm);
  const ld=it.lastDate||'';
  if(lk==null&&!ld) return true;
  if(ld&&date){ if(date>ld) return true; if(date<ld) return false; }
  return lk==null||Number(km)>=lk;
}
/* بيحدّث «آخر مرة» بس — مش البند كله — عشان المحرر يقدر يسجّل غيار من غير صلاحية تعديل البنود */
async function markDone(it,km,date,force){
  if(!it||(!force&&!isNewer(it,km,date)))return;
  const patch={lastKm:Number(km),lastDate:date||''};
  Object.assign(it,patch);
  await W(()=>carRef.collection('items').doc(it.id).set(patch,{merge:true}));
}
async function delLog(id){
  const lg=LOGS.find(x=>x.id===id);
  LOGS=LOGS.filter(x=>x.id!==id);
  await W(()=>carRef.collection('logs').doc(id).delete());
  if(lg) logEvent('log','مسح تسجيل: '+(lg.nm||'صيانة'),nf(lg.km)+' كم · '+fmtDate(lg.date));
  /* لو التسجيل الممسوح هو «آخر مرة» في البند، يرجع لآخر تسجيل قبله */
  const it=lg&&itemById(lg.itemId);
  if(it&&Number(it.lastKm)===Number(lg.km)&&(it.lastDate||'')===(lg.date||'')){
    const prev=LOGS.filter(l=>l.itemId===lg.itemId)
      .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(Number(b.km)||0)-(Number(a.km)||0))[0];
    if(prev) await markDone(it,prev.km,prev.date,true);
  }
  render();}

function logEvent(t,title,body){

  carRef.collection('events').add({t:t, title:String(title).slice(0,280), body:String(body||'').slice(0,480),
    by:fbUser.uid, name:MY_DISPLAY||MYEMAIL.split('@')[0], at:Date.now()}).catch(()=>{});
}

const NF_KEY=LS+'.nf';
let NF={seen:0,read:[],local:[]};
try{ const r=JSON.parse(localStorage.getItem(NF_KEY)||'null'); if(r)NF=Object.assign(NF,r); }catch(e){}
function nfSave(){ NF.read=NF.read.slice(-300); NF.local=NF.local.slice(-30); try{localStorage.setItem(NF_KEY,JSON.stringify(NF));}catch(e){} }
if(!NF.seen){ NF.seen=Date.now(); nfSave(); }      /* أول مرة: القديم مايتحسبش مش مقروء */
function nfPushLocal(n){ if(NF.local.some(x=>x.id===n.id))return; n.at=n.at||Date.now(); NF.local.push(n); nfSave(); updateBell(); }

function timeAgo(ms){ const m=Math.round((Date.now()-ms)/60000);
  if(m<1)return 'دلوقتي'; if(m<60)return 'من '+m+' دقيقة'; const h=Math.round(m/60);
  if(h<24)return 'من '+h+' ساعة'; const d=Math.round(h/24); return d===1?'امبارح':'من '+fmtDur(d); }

function nfItems(){
  const me=fbUser&&fbUser.uid, read=NF.read;
  const alerts=canSee('maint')?liveItems().map(it=>({it,s:itemState(it)})).filter(x=>x.s.st==='bad'||x.s.st==='warn')
    .sort((a,b)=>(a.s.st==='bad'?0:1)-(b.s.st==='bad'?0:1))
    .map(({it,s})=>{ const id='al:'+it.id+':'+(it.lastKm==null?'':it.lastKm)+':'+s.st;
      return {id,ic:icOf(it),cls:'alert',title:(s.st==='bad'?'محتاج صيانة دلوقتي: ':'قرّب ميعاده: ')+it.nm,
        body:shortStat(s),go:'home',unread:s.st==='bad'&&read.indexOf(id)<0}; }):[];
  const feed=EVENTS.map(e=>({id:'ev:'+e.id,ic:e.t==='log'?'🧾':e.t==='odo'?'📏':e.t==='user'?'👤':e.t==='perms'?'🧮':e.t==='item'?'🧰':'✏️',
      title:e.title,body:[e.name,e.body].filter(Boolean).join(' · ')+(e.at?' · '+timeAgo(e.at):''),at:e.at||0,
      go:e.t==='log'?'done':e.t==='item'?'log':e.t==='odo'?'home':'',unread:e.at>NF.seen&&e.by!==me&&read.indexOf('ev:'+e.id)<0}))
    .concat(NF.local.map(n=>Object.assign({},n,{body:(n.body||'')+(n.at?' · '+timeAgo(n.at):''),unread:read.indexOf(n.id)<0})))
    .sort((a,b)=>b.at-a.at);
  return {alerts,feed};
}
function updateBell(){
  const b=$('#bellN'); if(!b)return;

}

function vNotifs(){
  const {alerts,feed}=nfItems(), n=alerts.filter(x=>x.unread).length+feed.filter(x=>x.unread).length;
  let h='<div class="pghead"><h2>🔔 الإشعارات</h2>'
   + '<button class="btn sm ghost" id="nfAll"'+(n?'':' disabled')+'>قراءة الكل</button></div>';
  if(alerts.length) h+='<div class="nf-sec">محتاج انتباهك</div>'+alerts.map(nfCard).join('');

  const all=$('#nfAll'); if(all)all.onclick=()=>{
    NF.seen=Date.now(); const r=nfItems(); NF.read=NF.read.concat(r.alerts.map(a=>a.id),r.feed.map(f=>f.id)); nfSave(); render(); };

/* نسخة البرنامج: إشعار لما يتحدث، ولو فيه APK أحدث */
async function checkUpdates(){
  try{ const t=await fetch('./sw.js?t='+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const m=t.match(/VERSION\s*=\s*"(v\d+)"/);
    if(m){ APP_VER=m[1]; let seen=''; try{seen=localStorage.getItem(LS+'.ver')||'';}catch(e){}
      if(seen&&seen!==APP_VER) nfPushLocal({id:'ver:'+APP_VER,ic:'✨',title:'البرنامج اتحدث لنسخة '+APP_VER,body:'تحسينات وإضافات جديدة.'});
      try{localStorage.setItem(LS+'.ver',APP_VER);}catch(e){} }
  }catch(e){}
  if(!NATIVE) return;
  try{
    const rel=await fetch('https://api.github.com/repos/fatenbentmostafa-wq/skoda-a4/releases/tags/app',{cache:'no-store'}).then(r=>r.ok?r.json():null);
    const mm=rel&&String(rel.body||'').match(/1\.0\.(\d+)/); const latest=mm?+mm[1]:0;
    const A=NP('App');
    if(!A){ /* تطبيق قديم من غير أدوات البصمة والرجوع */
      nfPushLocal({id:'apk:old',ic:'📲',title:'نزّل النسخة الجديدة من التطبيق',body:'فيها البصمة وزرار الرجوع والمشاركة. ثبّتها فوق القديمة والداتا مش هتتمسح.',url:APP_APK,act:'نزّل التحديث'});
      return; }
    const info=await A.getInfo(); const mine=+(String(info.version).split('.').pop())||0;
    if(latest>mine) nfPushLocal({id:'apk:'+latest,ic:'📲',title:'فيه نسخة جديدة من التطبيق (1.0.'+latest+')',
      body:'نزّلها وثبّتها فوق القديمة، والداتا هتفضل زي ما هي.',url:APP_APK,act:'نزّل التحديث'});
  }catch(e){}
  render();
}

function itemState(it){
  const odo=Number(CAR.odo)||0;
  const lKm=(it.lastKm===''||it.lastKm==null)?null:Number(it.lastKm);
  const lDt=it.lastDate||null, iKm=Number(it.km)||0, iMo=Number(it.mo)||0;
  const now=new Date(todayISO()+'T00:00:00');
  let fracKm=null,leftKm=null,fracMo=null,leftDays=null,nextKm=null,nextDate=null;
  if(iKm>0&&lKm!=null){nextKm=lKm+iKm;leftKm=nextKm-odo;fracKm=(odo-lKm)/iKm;}
  if(iMo>0&&lDt){const nd=addMonths(lDt,iMo);
    if(nd){nextDate=nd;leftDays=daysBetween(nd,now);fracMo=1-(leftDays/(iMo*30.44));}}
  const known=(fracKm!=null||fracMo!=null);
  const frac=known?Math.max(fracKm==null?-9:fracKm,fracMo==null?-9:fracMo):null;
  /* أحمر: جه ميعاده أو فات. برتقالي: فاضل 1000 كم أو أقل (أو شهر أو أقل للبنود بالوقت) */
  let st='unknown';
  if(known){
    const kmDue  = leftKm!=null   && leftKm<=0;
    const dtDue  = leftDays!=null && leftDays<=0;
    const kmNear = leftKm!=null   && leftKm<=WARN_KM;
    const dtNear = leftDays!=null && leftDays<=WARN_DAYS;
    st=(kmDue||dtDue)?'bad':((kmNear||dtNear)?'warn':'ok');
  }
  let estDays=null; const avg=Number(CAR.avg)||0;
  if(leftKm!=null&&avg>0)estDays=Math.round(leftKm/avg*30.44);
  return {st,frac:known?Math.max(0,Math.min(frac,1.3)):0,leftKm,leftDays,nextKm,nextDate,estDays,known};
}
function shortStat(s){
  if(!s.known) return 'مش مسجّل';
  if(s.leftKm!=null&&s.leftKm<0) return 'فات '+nf(-s.leftKm)+' كم';
  if(s.leftDays!=null&&s.leftDays<0) return 'فات '+fmtDur(s.leftDays);
  if(s.leftKm!=null) return nf(s.leftKm)+' كم';
  if(s.leftDays!=null) return fmtDur(s.leftDays);
  return '';
}
const liveItems=()=>ITEMS.filter(i=>i.on!==false);
function byUrgency(a,b){
  /* زيت الموتور + الفلتر أول بند دايمًا */
  if(a.id==='oil'&&b.id!=='oil') return -1; if(b.id==='oil'&&a.id!=='oil') return 1;
  const A=itemState(a),B=itemState(b);
  const r=s=>s.st==='bad'?0:s.st==='warn'?1:s.st==='unknown'?2:3;
  if(r(A)!==r(B))return r(A)-r(B);
  if(A.known&&B.known)return B.frac-A.frac;
  return (a.ord||99)-(b.ord||99);}
const itemById=id=>ITEMS.find(i=>i.id===id);
const IV='?v=2';   /* يزيد مع كل تغيير في الأيقونات عشان الكاش */
const icOf=it=>{
  const em=(it&&it.ic)||'🔧', src=it&&(it.img||it.icImg);
  /* لو الصورة مش موجودة بيرجع للإيموچي بدل ما يبان مربع فاضي */
  return src?'<img src="'+esc(src)+IV+'" alt="" loading="lazy" onerror="this.onerror=null;'
    +'this.replaceWith(document.createTextNode(\''+em+'\'))">':esc(em);
};

function tiles(list){

      +'<div class="ic">'+icOf(it)+'</div>'

function setOdo(v,d){
  const patch={odo:v,odoDate:d};
  const pD=parseISO(CAR.odoDate),nD=parseISO(d),pO=Number(CAR.odo)||0;
  if(pD&&nD&&v>pO){const days=daysBetween(nD,pD);
    if(days>=20){const pm=Math.round((v-pO)/days*30.44); if(pm>50&&pm<20000)patch.avg=pm;}}
  return saveCar(patch);
}

function shCam(){
  open_('<h3><span class="ic">📷</span>صوّر العداد</h3>'
  +'<div class="note g">صوّر شاشة العداد قريّب وواضح. البرنامج هيقرا الرقم ويوريهولك تأكّده قبل الحفظ.</div>'
  +'<label class="f"><span>الصورة</span><input type="file" id="cF" accept="image/*" capture="environment"></label>'
  +'<div id="cOut"></div>'
  +'<div class="acts"><button class="btn ghost" id="cX">إلغاء</button></div>');

}
function readOdo(file){
  const out=$('#cOut'), url=URL.createObjectURL(file);
  out.innerHTML='<img id="shot" src="'+url+'"><div class="empty" style="padding:14px"><div class="spin"></div>بقرا الرقم…</div>';
  loadOCR().then(T=>T.recognize(file,'eng',{tessedit_char_whitelist:'0123456789'}))
    .then(res=>{
      const txt=(res&&res.data&&res.data.text)||'';
      const cands=(txt.match(/\d{3,7}/g)||[]).map(Number)
        .filter(n=>n>=(Number(CAR.odo)||0)-50000 && n<2000000)
        .sort((a,b)=>b-a);
      showOdoConfirm(url,cands[0]||'');
    })
    .catch(()=>showOdoConfirm(url,'',true));
}
function showOdoConfirm(url,val,failed){
  $('#cOut').innerHTML='<img id="shot" src="'+url+'">'
    +(failed?'<div class="note">مقدرتش أقرا الرقم من الصورة — اكتبه بنفسك تحت.</div>'
            :'<div class="note g">الرقم اللي قريته — راجعه وعدّله لو فيه غلط.</div>')
    +'<label class="f"><span>قراءة العداد</span><input id="cV" inputmode="numeric" value="'+esc(val)+'"></label>'
    +'<label class="f"><span>التاريخ</span><input id="cD" type="date" value="'+todayISO()+'"></label>'
    +'<div class="acts"><button class="btn ghost" id="cX2">إلغاء</button><button class="btn gold" id="cS">تأكيد وحفظ</button></div>';
  $('#cX2').onclick=close_;
  $('#cS').onclick=()=>{const v=parseInt($('#cV').value,10);
    if(isNaN(v)||v<0){alert('اكتب رقم العداد');return;}
    setOdo(v,$('#cD').value||todayISO()); logEvent('odo','حدّث العداد: '+nf(v)+' كم','بالكاميرا'); close_();};
  const i=$('#cV'); if(i&&!val)i.focus();
}
let _ocr=null;
function loadOCR(){
  if(_ocr)return _ocr;
  _ocr=new Promise((res,rej)=>{
    if(window.Tesseract)return res(window.Tesseract);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('no lib'));
    s.onerror=()=>rej(new Error('offline'));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error('timeout')),20000);
  });
  return _ocr;
}

     +((it.lastKm!=null&&it.lastKm!==''&&it.lastDate)?' · ':'')+(it.lastDate?fmtDate(it.lastDate):'')+'</div>';

  if(!ro && canEdit('items')){
    h+='<div class="card"><h3 style="font-size:13px">تعديل الميعاد</h3><div class="grid2">'
     +'<label class="f"><span>كل كام كم</span><input id="eK" inputmode="numeric" value="'+esc(it.km||0)+'"></label>'
     +'<label class="f"><span>كل كام شهر</span><input id="eM" inputmode="numeric" value="'+esc(it.mo||0)+'"></label>'
     +'<label class="f"><span>آخر مرة — العداد</span><input id="eLK" inputmode="numeric" value="'+esc(it.lastKm==null?'':it.lastKm)+'"></label>'

/* ══════════════ قفل البصمة (زي مصاريف البيت) ══════════════
   في تطبيق الأندرويد: NativeBiometric (البصمة أو الـ PIN).
   في المتصفح: WebAuthn — بصمة الموبايل نفسه. */
const LOCK_KEY=LS+'.lock';
let lockCred=null; try{ lockCred=localStorage.getItem(LOCK_KEY); }catch(e){}
let LOCK_OK=false, verifying=false, awayOk=false;
const allowAway=()=>{ awayOk=true; };   /* الكاميرا والمشاركة ودخول جوجل مايقفلوش البرنامج */
const b64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function lockSupported(){
  if(NATIVE){ const NB=NP('NativeBiometric'); if(!NB) return false;
    try{ const r=await NB.isAvailable({useFallback:true}); return !!(r&&r.isAvailable); }catch(e){ return false; } }
  try{ return window.isSecureContext && !!window.PublicKeyCredential
    && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; }
}
async function verifyUser(){
  verifying=true;
  try{
    if(NATIVE){ await NP('NativeBiometric').verifyIdentity({reason:'افتح صيانة سكودا',title:'صيانة سكودا',
      subtitle:'بصمتك أو الـ PIN',useFallback:true,maxAttempts:5}); return true; }
    const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),
      allowCredentials:[{type:'public-key',id:unb64(lockCred)}],userVerification:'required',timeout:60000}});
    return !!a;
  } finally { setTimeout(()=>{ verifying=false; },800); }
}
function showLock(){ if(!lockCred||!LOCK_OK) return; document.documentElement.classList.add('locked');
  $('#lockScreen').classList.remove('hidden'); $('#lockErr').classList.add('hidden'); }
function hideLock(){ document.documentElement.classList.remove('locked'); $('#lockScreen').classList.add('hidden'); }
const lockShown=()=>!$('#lockScreen').classList.contains('hidden');
async function tryUnlock(){
  if(verifying) return;
  try{ if(await verifyUser()) hideLock(); }
  catch(e){ const el=$('#lockErr'); el.textContent='ماتمش التأكيد. دوس «فتح» وجرّب تاني.'; el.classList.remove('hidden'); }
}
$('#unlockBtn').onclick=tryUnlock;
async function toggleLock(){
  if(lockCred){
    try{ if(!(await verifyUser())) return; }catch(e){ toast('لازم تأكد ببصمتك عشان توقف القفل'); return; }
    lockCred=null; try{ localStorage.removeItem(LOCK_KEY); }catch(e){} render(); toast('القفل اتوقف'); return;
  }
  if(NATIVE){
    try{ await verifyUser(); lockCred='native'; try{ localStorage.setItem(LOCK_KEY,lockCred); }catch(e){}
      render(); toast('القفل اشتغل ✓ من المرة الجاية التطبيق هيطلب بصمتك'); }
    catch(e){ toast('اتلغى تشغيل القفل'); }
    return;
  }
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'صيانة سكودا'},
      user:{id:rnd(16),name:'skoda',displayName:'صيانة سكودا'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    lockCred=b64(c.rawId); try{ localStorage.setItem(LOCK_KEY,lockCred); }catch(e){}
    render(); toast('القفل اشتغل ✓ من المرة الجاية البرنامج هيطلب بصمتك');
  }catch(e){ toast(e&&e.name==='NotAllowedError'?'اتلغى تشغيل القفل':'الموبايل ده مش بيدعم القفل بالبصمة من المتصفح'); }
}
/* يقفل كل ما البرنامج يخرج من الشاشة */
document.addEventListener('visibilitychange',()=>{
  if(!lockCred||!LOCK_OK) return;
  if(document.visibilityState==='hidden'){ if(verifying||awayOk) return; showLock(); }
  else { if(awayOk){ awayOk=false; return; } if(!verifying&&lockShown()) tryUnlock(); }
});

function wireLogin(){
  const go=$('#luGo'); if(go)go.onclick=doUserLogin;
  const p=$('#luP'); if(p)p.onkeydown=e=>{if(e.key==='Enter')doUserLogin();};
  const g=$('#luG'); if(g)g.onclick=async()=>{
    /* تطبيق الأندرويد: اختيار حساب جوجل من الموبايل نفسه، وبعدين الدخول على Firebase بنفس الحساب */
    const FA=NP('FirebaseAuthentication');
    if(FA){
      g.disabled=true; allowAway();
      try{ const r=await FA.signInWithGoogle({skipNativeAuth:true});
        const tok=r&&r.credential&&r.credential.idToken; if(!tok) throw new Error('no-token');
        await AUTH.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(tok)); }
      catch(e){ g.disabled=false; console.warn('google',e);
        if(!/cancel/i.test(String(e&&(e.message||e.code)||''))) loginErr('مقدرتش أدخل بجوجل — جرّب تاني'); }
      return;
    }
    const p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    g.disabled=true;
    if(IS_APP){
      try{ await AUTH.signInWithRedirect(p); }
      catch(e){ g.disabled=false; loginErr('مقدرتش أدخل بجوجل — جرّب تاني'); }
      return;
    }
    try{ await AUTH.signInWithPopup(p); }
    catch(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){
        try{ await AUTH.signInWithRedirect(p); return; }catch(e2){}
      }
      g.disabled=false;
      if(e&&e.code!=='auth/popup-closed-by-user') loginErr('مقدرتش أدخل بجوجل — جرّب تاني');
    }
  };
  const off=$('#luOff'); if(off)off.onclick=()=>startLocal('شغّال على الجهاز ده بس');

  const r=roleOf(c);
  if(!r){
    showLogin('<div class="note">الحساب ده (<b>'+esc(MYEMAIL)+'</b>) مضافش للعربية دي.<br>قول للمدير يضيفك من الإعدادات.</div>'
      +'<button class="btn ghost block" id="luOut" style="margin-top:12px">خروج</button>');
    const o=$('#luOut'); if(o)o.onclick=doLogout;
    return;
  }
  /* حساب جوجل المدير ضافه ولسه أول مرة يدخل: يربط نفسه */
  if(fbUser && c.owner!==fbUser.uid && !((c.uids||{})[MYEMAIL])){
    try{ await carRef.update(FP('uids',MYEMAIL),fbUser.uid); }catch(e){ console.warn('claim',e); }
  }
  setRealRole(r); MODE='db'; CAN_WRITE=true; hideLogin();

  /* خروج إجباري لكل الأجهزة */
  let lastForce=0; try{lastForce=+(localStorage.getItem(LS+'.force')||0);}catch(e){}
  if(c.forceExit && c.forceExit>lastForce && c.forceExit>Date.now()-86400000*3){
    try{localStorage.setItem(LS+'.force',String(c.forceExit));}catch(e){}
    doLogout(); return;
  }

  unsubAll();
  UNSUB.push(carRef.onSnapshot(s=>{
    if(!s.exists)return;
    const d=s.data();
    CAR=Object.assign({},DEFAULT_CAR,{nm:d.nm,plate:d.plate,year:d.year,odo:d.odo,
      odoDate:d.odoDate,avg:d.avg});
    try{CAR.bio=localStorage.getItem(LS+'.bio')==='1';}catch(e){}
    if(d.perms)mergePerms(d.perms);
    USERS=usersFromCar(d);
    MY_DISPLAY=((d.names||{})[MYEMAIL])||MYNAME||MYEMAIL.split('@')[0];
    MY_LOGIN=((d.unames||{})[MYEMAIL])||MYEMAIL;
    healCarMaps(d);
    /* التحديث من السيرفر مابيلغيش وضع التجربة؛ ولو المدير شالك تخرج */
    const nr=roleOf(d); if(!nr){doLogout();return;} setRealRole(nr);
    LOADED.car=1; render();
  },e=>{console.warn(e); if(e&&e.code==='permission-denied')doLogout();}));

  UNSUB.push(carRef.collection('items').onSnapshot(s=>{
    ITEMS=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    normalize(); LOADED.items=1; render();
  },e=>console.warn(e)));

  UNSUB.push(carRef.collection('logs').onSnapshot(s=>{
    LOGS=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    LOADED.logs=1; render();
  },e=>console.warn(e)));

  /* سجل التعديلات للجرس */
  UNSUB.push(carRef.collection('events').orderBy('at','desc').limit(60).onSnapshot(s=>{
    EVENTS=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(TAB==='notifs') render(); else updateBell();
  },e=>console.warn('events',e)));
}

/* ── إدارة المستخدمين (المدير) ──
   الإيميل فيه نقط، ولو اتبعت كنص في update فايرستور بيفهمه خانات متداخلة.
   FP بتخلّي الإيميل كله اسم خانة واحدة. */
function FP(a,b){ return new firebase.firestore.FieldPath(a,b); }
function flatPairs(obj,prefix,out){
  Object.keys(obj||{}).forEach(k=>{
    const v=obj[k], key=prefix?prefix+'.'+k:k;
    if(v&&typeof v==='object'&&!Array.isArray(v)) flatPairs(v,key,out);
    else out.push([key,v]);
  });
  return out;
}
/* بيصلّح المستخدمين اللي اتكتبوا غلط قبل كده */
async function healCarMaps(d){
  if(!carRef||!fbUser||!d||d.owner!==fbUser.uid) return;
  const DEL=firebase.firestore.FieldValue.delete(), ops=[];
  ['roles','names','unames','uids'].forEach(k=>{
    const m=d[k]||{};
    Object.keys(m).forEach(top=>{
      if(top.indexOf('@')>=0) return;
      const v=m[top];
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        flatPairs(v,top,[]).forEach(p=>{ if(p[0].indexOf('@')>=0) ops.push(FP(k,p[0]),p[1]); });
      }
      ops.push(FP(k,top),DEL);
    });
  });
  if(ops.length) try{ await carRef.update.apply(carRef,ops); }catch(e){}
}
async function createUser(name,username,pw,role){
  username=(username||'').trim().toLowerCase();
  if(!/^[a-z0-9._-]{3,}$/.test(username)) throw new Error('اسم المستخدم لازم يكون حروف إنجليزي وأرقام، 3 على الأقل');
  if(pw.length<6) throw new Error('كلمة السر لازم 6 حروف على الأقل');
  const taken=await FS.collection('carUsernames').doc(username).get();
  if(taken.exists) throw new Error('اسم المستخدم ده مستعمل');
  if(!SEC) SEC=firebase.initializeApp(window.FB_CONFIG,'sec');
  const email=username+'.'+Math.random().toString(36).slice(2,6)+SYNTH;
  const cred=await SEC.auth().createUserWithEmailAndPassword(email,pw);
  const uid=cred.user.uid;
  try{ await SEC.auth().signOut(); }catch(e){}
  await FS.collection('carUsernames').doc(username).set({email:email,car:CAR_ID});
  await FS.collection('carLogins').doc(uid).set({car:CAR_ID,email:email});
  await carRef.update(FP('roles',email),role, FP('names',email),name||username,
    FP('unames',email),username, FP('uids',email),uid,
    'emails',firebase.firestore.FieldValue.arrayUnion(email));
  logEvent('user','ضاف '+(name||username)+' — '+(ROLE_NM[role]||role));
}
/* إضافة حساب جوجل: بيتسجل بالإيميل، والـ uid بيتربط أول ما الشخص يدخل */
async function addGoogleUser(name,email,role){
  email=String(email||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('اكتب إيميل جوجل صح');
  if(email.indexOf(SYNTH)>=0) throw new Error('ده مش إيميل جوجل');
  if(USERS.some(u=>u.email===email)) throw new Error('الحساب ده مضاف قبل كده');
  await carRef.update(FP('roles',email),role, FP('names',email),name||email.split('@')[0],
    'emails',firebase.firestore.FieldValue.arrayUnion(email));
  logEvent('user','ضاف '+(name||email)+' — '+(ROLE_NM[role]||role));
}
async function updateUser(email,name,role){
  const old=USERS.find(u=>u.email===email);
  await carRef.update(FP('roles',email),role, FP('names',email),name);
  if(old&&old.role!==role) logEvent('user','غيّر صلاحية '+name+' لـ '+(ROLE_NM[role]||role));
}
async function removeUser(email,username){
  const old=USERS.find(u=>u.email===email);
  const DEL=firebase.firestore.FieldValue.delete();
  await carRef.update(FP('roles',email),DEL, FP('names',email),DEL,
    FP('unames',email),DEL, FP('uids',email),DEL,
    'emails',firebase.firestore.FieldValue.arrayRemove(email));
  if(username) await FS.collection('carUsernames').doc(username).delete().catch(()=>{});
  logEvent('user','شال '+((old&&old.name)||username||email)+' من البرنامج');
}
async function forceExitAll(){
  await carRef.update({forceExit:Date.now()});
  toast('كل الأجهزة هتتقفل وتفتح على آخر نسخة');
}

/* ── متابعة نسخة البرنامج (زي مصاريف البيت) ── */
let MY_VER=null, PENDING_VER=null;
/* بيقرا رقم النسخة من السيرفر مباشرة (من غير كاش) */
async function serverVersion(){
  const t=await fetch('./sw.js',{cache:'no-store'}).then(r=>r.text());
  const m=t.match(/VERSION\s*=\s*"([^"]+)"/); return m?m[1]:null;
}
/* كل 5 ثواني: لو فيه نسخة جديدة على السيرفر يطبّقها */
async function checkVersion(){
  if(document.visibilityState!=='visible') return;
  try{
    const v=await serverVersion(); if(!v) return;
    if(MY_VER===null){MY_VER=v;return;}
    if(v!==MY_VER){ PENDING_VER=v; applyUpdate(); }
  }catch(e){}
}
/* بيستنى لو إنت بتكتب أو فيه نافذة مفتوحة، عشان مايضيعش اللي بتعمله */
function applyUpdate(){
  if(!PENDING_VER) return;
  const a=document.activeElement;
  const busy=!$('#ov').classList.contains('hide') || (a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  if(busy){
    if(!applyUpdate._told){ applyUpdate._told=1; toast('فيه تحديث جديد — هيتطبق أول ما تخلص'); }
    clearTimeout(applyUpdate._t); applyUpdate._t=setTimeout(applyUpdate,3000); return;
  }
  /* مايطلبش البصمة تاني بسبب التحديث بس */
  try{ if(!lockShown()) sessionStorage.setItem(LS+'.nolock',String(Date.now())); }catch(e){}
  try{ navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); }catch(e){}
  location.reload();
}
/* زرار التحديث: يجيب آخر داتا من السيرفر، ولو فيه نسخة جديدة من البرنامج يحدّثه */
async function refreshNow(){
  const b=$('#rfBtn'); if(b.classList.contains('spin')) return;
  b.classList.add('spin');
  try{
    try{ const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }catch(e){}
    let v=null; try{ v=await serverVersion(); }catch(e){}
    if(v&&MY_VER&&v!==MY_VER){ PENDING_VER=v; toast('فيه نسخة جديدة — بحدّث البرنامج…'); setTimeout(applyUpdate,700); return; }
    if(MODE==='db'&&carRef){
      await Promise.all([carRef.get({source:'server'}),carRef.collection('items').get({source:'server'}),
        carRef.collection('logs').get({source:'server'})]).catch(()=>{});
      toast('اتحدثت الداتا من السيرفر ✓');
    } else toast('مش متصل بالسيرفر — ادخل بحسابك من الإعدادات');
    render();
  } finally { setTimeout(()=>b.classList.remove('spin'),600); }
}
$('#rfBtn').onclick=refreshNow;
/* زرار المزامنة في الإعدادات: لو فيه نسخة جديدة يحدّث البرنامج، ولو مفيش يجيب آخر داتا ويعيد تحميل البرنامج */
async function syncNow(btn){
  if(btn){ btn.disabled=true; btn.textContent='⏳ بزامن…'; }
  try{ const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }catch(e){}
  let v=null; try{ v=await serverVersion(); }catch(e){}
  if(v&&MY_VER&&v!==MY_VER){ PENDING_VER=v; toast('فيه نسخة جديدة — بحدّث البرنامج…'); setTimeout(applyUpdate,600); return; }
  if(MODE==='db'&&carRef){
    await Promise.all([carRef.get({source:'server'}),carRef.collection('items').get({source:'server'}),
      carRef.collection('logs').get({source:'server'})]).catch(()=>{});
  }
  toast('اتزامن ✓ — بعيد تحميل البرنامج');
  setTimeout(()=>{ try{ sessionStorage.setItem(LS+'.nolock',String(Date.now())); }catch(e){} location.reload(); },700);
}

/* ── الإقلاع ── */
(function boot(){
  lsLoad(); normalize();
  try{CAR.bio=localStorage.getItem(LS+'.bio')==='1';}catch(e){}

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
    checkVersion();
    setInterval(checkVersion,5000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
  }

  /* قفل البصمة + إشعارات التحديث */
  (async()=>{ LOCK_OK=await lockSupported();
    let justUpdated=false;
    try{ justUpdated=Date.now()-Number(sessionStorage.getItem(LS+'.nolock')||0)<20000; sessionStorage.removeItem(LS+'.nolock'); }catch(e){}
    if(LOCK_OK&&lockCred&&!justUpdated){ showLock(); tryUnlock(); }
    if(TAB==='cfg') render(); })();
  setTimeout(checkUpdates,2500);

  if(!cfgReady()||typeof firebase==='undefined'){ startLocal(); return; }

  try{
    firebase.initializeApp(window.FB_CONFIG);
    FS=firebase.firestore(); AUTH=firebase.auth();
    /* جوا WebView الأندرويد قناة Firestore العادية بتفشل — بنجبره على long polling */
    try{ FS.settings({experimentalForceLongPolling:true,useFetchStreams:false,merge:true}); }catch(e){}
    FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){ startLocal(); return; }

  render();
  AUTH.getRedirectResult().catch(e=>{ try{ loginErr('مقدرتش أدخل بجوجل — جرّب تاني'); }catch(x){} });
  AUTH.onAuthStateChanged(u=>{
    fbUser=u||null;
    if(!u){ unsubAll(); carRef=null; MODE='loading'; showLogin(); render(); return; }
    MYEMAIL=u.email||''; MYNAME=u.displayName||'';
    attachCar();
  });
})();
</script>
